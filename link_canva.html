<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentação: A Ciência das Tesouras</title>
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #bc00ff;
            --bg: #050508;
            --card-bg: rgba(255, 255, 255, 0.05);
        }
        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            max-width: 600px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        p {
            opacity: 0.7;
            margin-bottom: 2rem;
        }
        .links {
            display: grid;
            gap: 1rem;
        }
        .btn {
            display: block;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            border-radius: 1rem;
            transition: all 0.3s;
            font-weight: 600;
        }
        .btn:hover {
            background: var(--primary);
            color: var(--bg);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 242, 255, 0.3);
        }
        .author {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>A Ciência das Tesouras</h1>
        <p>Acesse os arquivos da apresentação técnica e histórica.</p>
        
        <div class="links">
            <a href="Apresentacao_Tecnica_Tesouras.pptx" class="btn">Abrir PowerPoint (.pptx)</a>
            <a href="Documentacao_Tecnica_Tesouras.docx" class="btn">Abrir Documento Word (.docx)</a>
            <a href="documento_tecnico_tesouras.md" class="btn">Visualizar Roteiro (Markdown)</a>
        </div>

        <div class="author">JOÃO GOUVÊA / 1F</div>
    </div>
</body>
</html>
